<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinEvents — POC dashboard</title>
<!--
  The gold POC dashboard (POC scaffolding toward REQ-901/903/908).

  Self-contained by design: no CDN, no fonts, no fetch. Data arrives as two
  script globals (./data/results.js, ./data/latest.js) so the page opens from
  file:// on a laptop and ships unchanged to S3 + CloudFront later (ADR-0020).

  Everything shown is derived work - scores, probabilities, sigma, edges
  (REQ-1106). No raw closes, no VIXCLS values (REQ-1107).

  Regenerate:
    uv run python scripts/evaluate_gold_poc.py --json ui/data/results.js
    uv run python scripts/forecast_gold_today.py
-->
<style>
  :root {
    --paper: #f7f5f1; --card: #fffefb; --ink: #21201c; --muted: #6f6a5e;
    --line: #e3ded2; --accent: #a0721c; --accent-soft: #f2e5c9;
    --bad: #a63d2f; --bad-soft: #f4e3df; --good: #40702f; --good-soft: #e5eddd;
    --b0: #a63d2f; --b1: #cf8b6d; --b2: #d6d0c0; --b3: #85a86a; --b4: #4a7f45;
    font-size: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.45; padding: 2.2rem 1.2rem 4rem;
  }
  main { max-width: 1020px; margin: 0 auto; }
  h1 { font-size: 1.55rem; font-weight: 650; letter-spacing: .2px; }
  h1 .fin { color: var(--accent); }
  h2 {
    font-size: .82rem; font-weight: 650; text-transform: uppercase;
    letter-spacing: .13em; color: var(--muted); margin: 0 0 .8rem;
  }
  .sub { color: var(--muted); margin-top: .35rem; font-size: .95rem; }
  .meta { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: .9rem; }
  .chip {
    font-size: .74rem; color: var(--muted); background: var(--card);
    border: 1px solid var(--line); border-radius: 99px; padding: .18rem .6rem;
    white-space: nowrap;
  }
  .chip b { color: var(--ink); font-weight: 600; }
  section {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 1.25rem 1.4rem 1.35rem; margin-top: 1.15rem;
  }
  .hero { display: flex; gap: 2.2rem; flex-wrap: wrap; align-items: stretch; }
  .hero .big { flex: 1 1 300px; }
  .hero .big .n { font-size: 2.5rem; font-weight: 700; line-height: 1.1; }
  .hero .big .n small { font-size: 1.15rem; color: var(--muted); font-weight: 500; }
  .hero .big p { margin-top: .45rem; color: var(--muted); font-size: .92rem; max-width: 34ch; }
  .hero .watch { flex: 1 1 300px; border-left: 3px solid var(--accent); padding-left: 1.1rem; }
  .hero .watch .t { font-weight: 650; }
  .hero .watch p { color: var(--muted); font-size: .92rem; margin-top: .3rem; }
  /* Selection must be unmissable in every chip scope — the control bar, the
     section filters, and chart legends all share one visual language. */
  #controls button.on, .filters button.on, .legend button.on {
    background: var(--ink); color: var(--paper); border-color: var(--ink);
  }
  #controls button:hover:not(.on), .filters button:hover:not(.on), .legend button:hover:not(.on) {
    border-color: var(--ink);
  }
  tbody tr.pickable:hover td { background: rgba(60, 54, 38, 0.05); }
  .bar { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: .9rem; }
  .scroll { overflow-x: auto; }
  .scroll table { min-width: 620px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: .42rem .6rem; font-size: .9rem; }
  th { color: var(--muted); font-weight: 600; font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; border-bottom: 1px solid var(--line); }
  tbody tr { border-bottom: 1px solid #eeeae0; }
  tbody tr:last-child { border-bottom: 0; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  .rname { font-weight: 600; white-space: nowrap; }
  .bench { white-space: nowrap; }
  .rname .dot { display: inline-block; width: .62rem; height: .62rem; border-radius: 50%; margin-right: .5rem; vertical-align: baseline; }
  .bench { color: var(--muted); font-size: .8rem; }
  .verdict { font-size: .74rem; padding: .13rem .5rem; border-radius: 99px; white-space: nowrap; }
  .v-worse { background: var(--bad-soft); color: var(--bad); }
  .v-nd { background: #efece3; color: var(--muted); }
  .v-better { background: var(--good-soft); color: var(--good); }
  .strip { display: flex; height: 1.35rem; border-radius: 4px; overflow: hidden; min-width: 260px; }
  .strip div { display: flex; align-items: center; justify-content: center; font-size: .68rem; color: rgba(255,255,255,.92); overflow: hidden; white-space: nowrap; }
  .strip div.lite { color: #56513f; }
  #controls {
    position: sticky; top: 0; z-index: 10; background: var(--paper);
    padding: .75rem 0 .65rem; border-bottom: 1px solid var(--line); margin-top: 1.1rem;
    display: flex; flex-wrap: wrap; gap: .5rem 1.6rem; align-items: center;
  }
  #controls .group { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
  tr.focused td { background: var(--accent-soft); }
  tbody tr.pickable { cursor: pointer; }
  .legend, .filters { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
  #controls button,
  .legend button, .filters button {
    font: inherit; font-size: .76rem; cursor: pointer; border-radius: 99px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: .16rem .6rem .16rem .5rem; display: inline-flex; align-items: center; gap: .4rem;
  }
  .legend button .sw { width: .95rem; height: 3px; border-radius: 2px; }
  .legend button.off { opacity: .38; }
  .filters button .sw, #controls button .sw { width: .6rem; height: .6rem; border-radius: 50%; }
  .filters button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .filters .label, #controls .label { font-size: .74rem; color: var(--muted); margin-right: .15rem; }
  .filters .sep { flex-basis: 100%; height: 0; }
  .blegend { display: flex; flex-wrap: wrap; gap: .9rem; font-size: .76rem; color: var(--muted); margin: .5rem 0 .2rem; }
  .blegend span { display: inline-flex; align-items: center; gap: .35rem; }
  .blegend i { width: .7rem; height: .7rem; border-radius: 2px; display: inline-block; }
  .stats { display: flex; gap: 2rem; flex-wrap: wrap; margin-top: .9rem; }
  .stat .v { font-size: 1.45rem; font-weight: 700; }
  .stat .v small { font-size: .85rem; color: var(--muted); font-weight: 500; }
  .stat .l { font-size: .76rem; color: var(--muted); max-width: 20ch; }
  .stat .ref { font-size: .74rem; color: var(--muted); margin-top: .1rem; }
  .aim { border-left: 3px solid var(--accent); padding: .1rem 0 .1rem 1rem; margin-top: 1rem; color: #4c493f; font-size: .9rem; max-width: 72ch; }
  svg text { font-family: inherit; }
  .note { color: var(--muted); font-size: .8rem; margin-top: .7rem; }
  .story { list-style: none; }
  .story li { display: flex; gap: .85rem; padding: .5rem 0; border-bottom: 1px solid #eeeae0; font-size: .9rem; }
  .story li:last-child { border-bottom: 0; }
  .story .tag { flex: 0 0 auto; font-size: .7rem; font-weight: 700; color: var(--accent); letter-spacing: .06em; padding-top: .15rem; min-width: 5.4rem; }
  .story p { color: #4c493f; }
  .story b { color: var(--ink); }
  #tooltip {
    position: fixed; pointer-events: none; background: var(--ink); color: var(--paper);
    font-size: .74rem; padding: .45rem .6rem; border-radius: 6px; display: none;
    font-variant-numeric: tabular-nums; z-index: 30; max-width: 240px;
  }
  #tooltip .d { color: #cfc9b8; margin-bottom: .2rem; }
  .empty { border: 1px dashed var(--line); border-radius: 10px; padding: 2rem; margin-top: 1.5rem; color: var(--muted); }
  .empty code { display: block; background: var(--ink); color: var(--paper); border-radius: 6px; padding: .55rem .8rem; margin-top: .6rem; font-size: .82rem; }
  footer { color: var(--muted); font-size: .78rem; margin-top: 1.6rem; line-height: 1.7; }
  @media (max-width: 640px) {
    body { padding: 1.2rem .7rem 3rem; }
    section { padding: 1rem; }
    /* A wrapped bar can eat half a phone screen — anchored beats sticky there. */
    #controls { position: static; }
  }
</style>
</head>
<body>
<main id="app">
  <header>
    <h1><span class="fin">FinEvents</span> · the forecasting POC — honestly scored</h1>
    <div class="sub">Two foundation models against history's base rates, on live days neither has ever seen. A forecast is only as good as the bar it beats.</div>
    <div class="meta" id="meta"></div>
  </header>

  <div id="controls"></div>

  <div id="content"></div>

  <div id="tooltip"></div>

  <footer id="foot"></footer>
</main>

<script src="./data/results.js"></script>
<script src="./data/latest.js"></script>
<script src="./data/prices.js"></script>
<script src="./data/results_usd_rub.js"></script>
<script src="./data/prices_usd_rub.js"></script>
<script src="./data/results_usd_inr.js"></script>
<script src="./data/prices_usd_inr.js"></script>
<script src="./data/results_wti.js"></script>
<script src="./data/prices_wti.js"></script>
<script src="./data/results_silver.js"></script>
<script src="./data/prices_silver.js"></script>
<script src="./data/live.js"></script>
<script>
"use strict";
const REG = window.POC_REGISTRY || {};

// What each series IS — the question every visitor asks first.
const INSTRUMENTS = {
  gold: {
    label: "Gold · ₽/g",
    title: "gold, in roubles per gram",
    unit: "₽ per gram",
    short: "₽/g",
    decimals: 0,
    ounce: 31.1035,
    blurb: "The Bank of Russia's official daily gold fix — an XAU/RUB series, priced per gram. " +
      "It is NOT the dollar gold price you see quoted elsewhere: the target lives in roubles, " +
      "so a rouble move is part of every move on this chart. Chosen as the one free, " +
      "licence-clean source with eleven years of daily history (DATA_SOURCES.md).",
  },
  silver: {
    label: "Silver · ₽/g",
    title: "silver, in roubles per gram",
    unit: "₽ per gram",
    short: "₽/g",
    decimals: 2,
    ounce: 31.1035,
    names: { chronos_cov: "Chronos-2 + gold", timesfm_cov: "TimesFM + gold" },
    blurb: "Gold's sister metal, from the same Bank of Russia daily fix — and the mirror " +
      "experiment. For gold, silver was the one covariate that did no harm (their daily " +
      "returns co-move at 0.68 — the only genuinely co-integrated pair in the set). Here the " +
      "roles reverse: silver is forecast with GOLD as the sole covariate, testing whether that " +
      "harmlessness is symmetric — and whether return co-movement can ever add skill rather " +
      "than merely not subtract it.",
  },
  usd_rub: {
    label: "USD / RUB",
    title: "the US dollar, in roubles",
    unit: "₽ per $1",
    short: "₽/$",
    decimals: 2,
    blurb: "How many roubles one dollar buys — the Bank of Russia's official daily rate, the very " +
      "fix that converts the gold series. An officially managed rate: its long quiet stretches " +
      "are real, not missing data. Until now it only fed gold's forecast as a covariate; here " +
      "it is forecast in its own right (univariate rungs only).",
  },
  usd_inr: {
    label: "USD / INR",
    title: "the US dollar, in rupees",
    unit: "₹ per $1",
    short: "₹/$",
    decimals: 2,
    blurb: "How many Indian rupees one dollar buys — the US Federal Reserve's H.10 reference " +
      "rate. Until now it only fed gold's forecast as a covariate; here it is forecast in its " +
      "own right (univariate rungs only).",
  },
  wti: {
    label: "Oil (WTI)",
    title: "WTI crude oil, in dollars per barrel",
    unit: "$ per barrel",
    short: "$/bbl",
    decimals: 2,
    blurb: "West Texas Intermediate crude — the US oil benchmark (EIA, via FRED). The series " +
      "starts July 2020 on principle: WTI printed −$37 in April 2020, and a negative price " +
      "has no log-return for the σ machinery to work with. Until now it fed gold's forecast " +
      "as a covariate; here it is forecast in its own right (univariate rungs only).",
  },
};

// Friendly names for the internal rung keys, used everywhere a human reads them.
const NAME = {
  climatology: "Base rates (climatology)",
  cond_climatology: "Base rates, by regime",
  chronos_uni: "Chronos-2",
  timesfm_uni: "TimesFM 2.5",
  chronos_cov: "Chronos-2 + signals",
  timesfm_cov: "TimesFM + signals",
  chronos_oilfx: "Chronos-2 + oil & FX",
  timesfm_oilfx: "TimesFM + oil & FX",
  chronos_rwcov: "Chronos-2 + random walk (control)",
  timesfm_rwcov: "TimesFM + random walk (control)",
  all_flat: "Always-flat dummy",
};
const rname = r =>
  ((INSTRUMENTS[state.instrument] || {}).names || {})[r] || NAME[r] || r;

// A legend swatch that is the line itself — same colour, same dash — because a
// solid pill cannot explain a dotted line.
function lineSwatch(rung) {
  const style = RUNG_STYLE[rung] || { color: "#888", dash: "" };
  const s = el("svg:svg", { width: 24, height: 10, viewBox: "0 0 24 10", style: "flex:0 0 auto" });
  s.appendChild(el("svg:line", {
    x1: 1, y1: 5, x2: 23, y2: 5,
    stroke: style.color, "stroke-width": 2.2, "stroke-dasharray": style.dash || "",
  }));
  return s;
}

// Data files merge into POC_REGISTRY; gold's original bare globals still load
// as a fallback so previously generated files keep working.
function pack(inst) {
  const slice = REG[inst] || {};
  if (inst === "gold") {
    return {
      D: slice.results || window.POC_DATA,
      P: slice.prices || window.POC_PRICES,
      L: slice.latest || window.POC_LATEST,
    };
  }
  return { D: slice.results, P: slice.prices, L: slice.latest };
}
const AVAILABLE = Object.keys(INSTRUMENTS).filter(k => pack(k).D);
let D = null, P = null, L = null; // the active instrument's data — set by render()
const BUCKET_COLOR = ["var(--b0)","var(--b1)","var(--b2)","var(--b3)","var(--b4)"];
const BUCKET_LITE = [false, false, true, false, false];
const RUNG_STYLE = {
  climatology:      { color: "#57534a", dash: "" },
  cond_climatology: { color: "#8a7f66", dash: "5 4" },
  chronos_uni:      { color: "#a0721c", dash: "" },
  chronos_cov:      { color: "#cf9c3d", dash: "6 4" },
  chronos_oilfx:    { color: "#7d5410", dash: "3 3" },
  chronos_rwcov:    { color: "#c9b48a", dash: "1 3" },
  timesfm_uni:      { color: "#2b6cb0", dash: "" },
  timesfm_cov:      { color: "#7aa6cf", dash: "6 4" },
  timesfm_oilfx:    { color: "#1d4a7a", dash: "3 3" },
  timesfm_rwcov:    { color: "#a8c2d8", dash: "1 3" },
  all_flat:         { color: "#b0aa9b", dash: "2 4" },
};
// One state, one control bar. `rung` is the FOCUSED method: the price chart
// draws its ribbon, the day-by-day view its guesses, the race chart bolds its
// line, and every table highlights its row. Click a method anywhere to focus it.
const state = {
  instrument: "gold", horizon: null, rung: "chronos_uni",
  span: "90", movingOnly: false, flatZone: false,
};

function setFocus(rung) { state.rung = rung; render(); }

function spanSlice(list) {
  const count = state.span === "all" ? list.length : Math.min(list.length, parseInt(state.span, 10));
  return list.slice(-count);
}

const priceFmt = x => x.toLocaleString("en-US", {
  maximumFractionDigits: INSTRUMENTS[state.instrument].decimals,
});

function el(tag, attrs, ...children) {
  const node = tag.startsWith("svg:")
    ? document.createElementNS("http://www.w3.org/2000/svg", tag.slice(4))
    : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c) node.appendChild(c);
  return node;
}
const fmt = (x, dp = 4) => (x >= 0 ? "+" : "") + x.toFixed(dp);

function emptyState() {
  document.getElementById("content").appendChild(el("div", { class: "empty" },
    el("div", { text: "No data yet. Generate it, then reload this page:" }),
    el("code", { text:
      "uv run python scripts/evaluate_gold_poc.py --json ui/data/results.js --prices ui/data/prices.js" }),
    el("code", { text: "uv run python scripts/forecast_gold_today.py" })));
}

function meta() {
  const m = document.getElementById("meta");
  m.textContent = "";
  const chips = [
    ["window", `${D.window.from} → ${D.window.to} · ${D.window.days} days`],
    ["target", D.target],
    ["clean from", D.window.clean_from + " — models trained before it"],
    ["context", D.context + " sessions"],
    ["errors", D.errors],
  ];
  if (D.rungs.some(r => r.endsWith("_cov"))) chips.splice(4, 0, ["covariate join", D.fred_join]);
  for (const [k, v] of chips) {
    const c = el("span", { class: "chip" }); c.innerHTML = `${k} <b></b>`;
    c.querySelector("b").textContent = v; m.appendChild(c);
  }
}

function controls() {
  const bar = document.getElementById("controls");
  bar.textContent = "";
  const group = (label, buttons) => {
    const g = el("div", { class: "group" });
    g.appendChild(el("span", { class: "label", text: label }));
    for (const b of buttons) g.appendChild(b);
    bar.appendChild(g);
  };
  if (AVAILABLE.length > 1)
    group("instrument", AVAILABLE.map(k => el("button", {
      text: INSTRUMENTS[k].label, class: k === state.instrument ? "on" : "",
      onclick: () => { state.instrument = k; render(); },
    })));
  group("horizon", D.horizons.map(h => el("button", {
    text: "t+" + h, class: h === state.horizon ? "on" : "",
    onclick: () => { state.horizon = h; render(); },
  })));
  group("method", D.rungs.map(r => el("button", {
    class: r === state.rung ? "on" : "", title: r,
    onclick: () => setFocus(r),
  }, el("span", { class: "sw", style: "background:" + ((RUNG_STYLE[r] || {}).color || "#888") }),
     document.createTextNode(rname(r)))));
  group("chart window", ["30", "90", "all"].map(s => el("button", {
    text: s === "all" ? "all days" : "last " + s,
    class: state.span === s ? "on" : "",
    onclick: () => { state.span = s; render(); },
  })));
}

function hero() {
  const contenders = D.ladder[state.horizon].filter(r => !r.baseline && r.rung !== "all_flat");
  const beat = contenders.filter(r => r.verdict === "BETTER").length;
  const chronos = (D.ladder["5"] || []).find(r => r.rung === "chronos_uni");
  const wrap = el("section", null);
  wrap.appendChild(el("h2", { text: "The headline" }));
  const flex = el("div", { class: "hero" });
  const big = el("div", { class: "big" });
  big.appendChild(el("div", { class: "n", text: `${beat} of ${contenders.length} ` }))
     .appendChild(el("small", { text: `methods beat the base rates at t+${state.horizon}` }));
  big.appendChild(el("p", { text: beat === 0
    ? "The null is holding. Unconditional climatology remains the bar — no rung clears it " +
      "with an interval that excludes zero, and the bar is free."
    : `${beat} interval${beat > 1 ? "s" : ""} exclude${beat > 1 ? "" : "s"} zero on ` +
      `${D.window.days} days. Small samples produce confident-looking intervals — read ` +
      "the whiskers below before believing a win." }));
  flex.appendChild(big);
  if (chronos && !chronos.baseline) {
    const includesZero = chronos.lo <= 0 && chronos.hi >= 0;
    const w = el("div", { class: "watch" });
    w.appendChild(el("div", { class: "t", text: `Worth watching: ${rname("chronos_uni")} at t+5 — wins ${chronos.wins}/${chronos.n} days` }));
    w.appendChild(el("p", { text:
      `Mean ${fmt(chronos.diff)} vs the bar, interval [${fmt(chronos.lo)}, ${fmt(chronos.hi)}] ` +
      (includesZero
        ? "still includes zero: it wins often by a little and loses occasionally by a lot. Not yet a finding."
        : "excludes zero on this sample — check the sample size and the whiskers before calling it a finding.") }));
    flex.appendChild(w);
  }
  wrap.appendChild(flex);
  return wrap;
}

function priceChart() {
  const info = INSTRUMENTS[state.instrument];
  const wrap = el("section", null);
  wrap.appendChild(el("h2", { text: `The price, and each method's promised range · t+${state.horizon}` }));

  const card = el("div", { class: "aim", style: "margin:.4rem 0 .9rem" });
  card.appendChild(el("div", { style: "font-weight:650", text: "What you're looking at: " + info.title }));
  card.appendChild(el("p", { style: "margin-top:.25rem", text: info.blurb }));
  if (P) {
    const last = P.series.close[P.series.close.length - 1];
    const ounce = info.ounce
      ? ` — about ₽${Math.round(last * info.ounce).toLocaleString("en-US")} per troy ounce (31.1035 g)`
      : "";
    card.appendChild(el("p", { style: "margin-top:.25rem", text:
      `Latest: ${priceFmt(last)} ${info.unit}${ounce}.` }));
  }
  wrap.appendChild(card);

  wrap.appendChild(el("p", { class: "note", text:
    "Before each day happened, the method drew a zone: “the price will land in here, 8 days " +
    "in 10.” Then the day happened. Hover any day to see both." }));

  if (!P) {
    wrap.appendChild(el("div", { class: "note", style: "margin-top:.8rem", text:
      "The price layer is generated locally and never committed (CBR terms are still an open " +
      "question — see DATA_SOURCES.md). Create it, then reload:" }));
    wrap.appendChild(el("div", { class: "empty", style: "margin-top:.6rem; padding:1rem" },
      el("code", { text:
        "uv run python scripts/evaluate_gold_poc.py --json ui/data/results.js --prices ui/data/prices.js" })));
    return wrap;
  }

  const hz = P.horizons[state.horizon];
  const tracks = Object.keys(hz.bands);
  const closeAt = new Map(P.series.dates.map((d, i) => [d, P.series.close[i]]));

  const filters = el("div", { class: "filters" });
  filters.appendChild(el("button", {
    text: "show “flat” zone", class: state.flatZone ? "on" : "",
    onclick: () => { state.flatZone = !state.flatZone; render(); },
  }));
  wrap.appendChild(filters);

  const total = hz.dates.length;
  const count = state.span === "all" ? total : Math.min(total, parseInt(state.span, 10));
  const start = total - count;
  const idx = [...Array(count).keys()].map(k => start + k);
  // The bar's focused method drives this chart. A baseline focus (base rates,
  // always-flat) has no price band — the chart then shows just the price and
  // says so, rather than pretending buckets are a ribbon.
  const selected = tracks.includes(state.rung) ? [state.rung] : [];
  const one = selected.length === 1 ? selected[0] : null;
  const ahead = state.horizon === "1" ? "1 trading day ahead" : `${state.horizon} trading days ahead`;

  // The coverage story, computed before anything is drawn — the rings, the
  // stats and the plain-English verdict all read from this one pass.
  let cov = null;
  if (one) {
    cov = { inside: 0, escapes: [], errors: [], biggest: null };
    for (const i of idx) {
      const c = closeAt.get(hz.dates[i]);
      if (c === undefined) continue;
      const q = hz.bands[one][i];
      const deviation = Math.abs(c / q[4] - 1) * 100;
      cov.errors.push(deviation);
      if (q[0] <= c && c <= q[8]) cov.inside++;
      else {
        cov.escapes.push(i);
        if (!cov.biggest || deviation > cov.biggest.deviation)
          cov.biggest = { date: hz.dates[i], deviation };
      }
    }
    cov.n = cov.inside + cov.escapes.length;
  }

  const lo = [], hi = [];
  for (const i of idx) {
    const c = closeAt.get(hz.dates[i]);
    if (c !== undefined) { lo.push(c); hi.push(c); }
    for (const t of selected) { lo.push(hz.bands[t][i][0]); hi.push(hz.bands[t][i][8]); }
    if (state.flatZone) { lo.push(hz.flat_lo[i]); hi.push(hz.flat_hi[i]); }
  }
  let yMin = Math.min(...lo), yMax = Math.max(...hi);
  const pad = (yMax - yMin || 1) * 0.06; yMin -= pad; yMax += pad;

  const W = 940, H = 330, ml = 62, mr = 14, mt = 26, mb = 28;
  const x = k => count < 2 ? (ml + W - mr) / 2 : ml + (k / (count - 1)) * (W - ml - mr);
  const y = v => mt + (1 - (v - yMin) / (yMax - yMin)) * (H - mt - mb);
  const svg = el("svg:svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: "display:block; min-width:760px" });

  const step = (yMax - yMin) / 4;
  for (let k = 0; k <= 4; k++) {
    const v = yMin + step * k;
    svg.appendChild(el("svg:line", { x1: ml, y1: y(v), x2: W - mr, y2: y(v), stroke: "#efebe0", "stroke-width": 1 }));
    svg.appendChild(el("svg:text", { x: ml - 7, y: y(v) + 3.5, "text-anchor": "end", "font-size": 10.5, fill: "#8d887b", text: priceFmt(v) }));
  }
  svg.appendChild(el("svg:text", { x: ml - 7, y: 13, "text-anchor": "end", "font-size": 10, fill: "#b0aa9b", text: info.short }));
  let lastMonth = "";
  idx.forEach((i, k) => {
    const month = hz.dates[i].slice(0, 7);
    if (month !== lastMonth && k > 0) {
      svg.appendChild(el("svg:line", { x1: x(k), y1: mt, x2: x(k), y2: H - mb, stroke: "#f2efe6", "stroke-width": 1 }));
      svg.appendChild(el("svg:text", { x: x(k), y: H - 9, "text-anchor": "middle", "font-size": 10.5, fill: "#8d887b", text: month }));
    }
    lastMonth = month;
  });

  if (state.flatZone) {
    const area = idx.map((i, k) => (k ? "L" : "M") + x(k).toFixed(1) + " " + y(hz.flat_hi[i]).toFixed(1)).join(" ")
      + idx.slice().reverse().map((i, r) => "L" + x(count - 1 - r).toFixed(1) + " " + y(hz.flat_lo[i]).toFixed(1)).join(" ") + "Z";
    svg.appendChild(el("svg:path", { d: area, fill: "#8d887b", opacity: 0.13 }));
  }

  for (const t of selected) {
    const color = (RUNG_STYLE[t] || {}).color || "#888";
    const area = idx.map((i, k) => (k ? "L" : "M") + x(k).toFixed(1) + " " + y(hz.bands[t][i][8]).toFixed(1)).join(" ")
      + idx.slice().reverse().map((i, r) => "L" + x(count - 1 - r).toFixed(1) + " " + y(hz.bands[t][i][0]).toFixed(1)).join(" ") + "Z";
    svg.appendChild(el("svg:path", { d: area, fill: color, opacity: 0.16 }));
    const median = idx.map((i, k) => (k ? "L" : "M") + x(k).toFixed(1) + " " + y(hz.bands[t][i][4]).toFixed(1)).join(" ");
    svg.appendChild(el("svg:path", { d: median, fill: "none", stroke: color, "stroke-width": 1.4, "stroke-dasharray": "5 4" }));
  }

  const actual = [];
  idx.forEach((i, k) => {
    const c = closeAt.get(hz.dates[i]);
    if (c !== undefined) actual.push({ k, i, c });
  });
  const line = actual.map((p, j) => (j ? "L" : "M") + x(p.k).toFixed(1) + " " + y(p.c).toFixed(1)).join(" ");
  svg.appendChild(el("svg:path", { d: line, fill: "none", stroke: "#21201c", "stroke-width": 1.7 }));
  for (const p of actual)
    svg.appendChild(el("svg:circle", { cx: x(p.k), cy: y(p.c), r: 1.9, fill: "#21201c" }));

  if (cov) {
    const escaped = new Set(cov.escapes);
    for (const p of actual)
      if (escaped.has(p.i))
        svg.appendChild(el("svg:circle", { cx: x(p.k), cy: y(p.c), r: 4.6, fill: "none", stroke: "var(--bad)", "stroke-width": 1.6 }));
  }

  const tip = document.getElementById("tooltip");
  svg.addEventListener("mousemove", ev => {
    const rect = svg.getBoundingClientRect();
    const px = ((ev.clientX - rect.left) / rect.width) * W;
    const k = Math.max(0, Math.min(count - 1, Math.round(((px - ml) / (W - ml - mr)) * (count - 1))));
    const i = idx[k];
    const c = closeAt.get(hz.dates[i]);
    const rows = selected.map(t => {
      const q = hz.bands[t][i];
      const out = c !== undefined && (c < q[0] || c > q[8]);
      return `<span style="color:${(RUNG_STYLE[t] || {}).color}">●</span> ${rname(t)}: guessed ${priceFmt(q[4])}, ` +
             `zone ${priceFmt(q[0])} – ${priceFmt(q[8])}${out ? " · <b>breakout</b>" : ""}`;
    });
    tip.innerHTML = `<div class="d">${hz.dates[i]} · actual ${c === undefined ? "n/a" : priceFmt(c)}</div>` + rows.join("<br>");
    tip.style.display = "block";
    tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - 260) + "px";
    tip.style.top = (ev.clientY + 14) + "px";
  });
  svg.addEventListener("mouseleave", () => { tip.style.display = "none"; });

  const key = el("div", { class: "blegend", style: "margin-top:.7rem" });
  const keyItem = (node, label) => {
    const s = el("span", null); s.appendChild(node);
    s.appendChild(document.createTextNode(label)); return s;
  };
  const bandColor = one ? (RUNG_STYLE[one] || {}).color : "var(--accent)";
  key.appendChild(keyItem(el("span", { style:
    "display:inline-block;width:1rem;height:2px;background:#21201c" }), "the actual price"));
  key.appendChild(keyItem(el("i", { style: `background:${bandColor};opacity:.35` }),
    one ? `${rname(one)}'s 8-in-10 zone, ${ahead}` : `each band = that method's 8-in-10 zone, ${ahead}`));
  key.appendChild(keyItem(el("span", { style:
    `display:inline-block;width:1rem;border-top:2px dashed ${bandColor}` }),
    one ? "its best single guess" : "each method's best single guess (dashed, in its colour)"));
  if (state.flatZone)
    key.appendChild(keyItem(el("i", { style: "background:#8d887b;opacity:.4" }),
      "moves this small counted as “flat”"));
  key.appendChild(keyItem(el("span", { style:
    "display:inline-block;width:.6rem;height:.6rem;border-radius:50%;border:2px solid var(--bad)" }),
    "breakout — the price left the zone"));
  wrap.appendChild(key);

  if (cov && cov.n) {
    const pct = Math.round(100 * cov.inside / cov.n);
    let verdict;
    if (pct >= 76 && pct <= 86) verdict = "right in line with what an 8-in-10 zone should do";
    else if (pct > 86) verdict = "more than promised — its zones are drawn a touch too wide (playing safe)";
    else verdict = "less than promised — its zones are too narrow (overconfident)";
    cov.errors.sort((a, b) => a - b);
    const typical = cov.errors[Math.floor(cov.errors.length / 2)].toFixed(1);
    const biggest = cov.biggest ? ` Its biggest surprise: ${cov.biggest.date}.` : "";
    wrap.appendChild(el("div", { class: "aim", style: "margin:.8rem 0 .3rem", text:
      `The verdict on ${rname(one)}: over these ${cov.n} days the price stayed inside its zone ` +
      `${cov.inside} times (${pct}%) — ${verdict}. Its best single guess was off by about ` +
      `${typical}% on a typical day.${biggest}` }));
  } else if (!one) {
    wrap.appendChild(el("div", { class: "note", style: "margin-top:.7rem", text:
      `${rname(state.rung)} promises buckets, not price ranges — pick a model method in the ` +
      "bar above to see its ribbon, its verdict, and its breakouts ringed in red." }));
  }

  wrap.appendChild(el("div", { class: "scroll", style: "margin-top:.4rem" }, svg));
  wrap.appendChild(el("div", { class: "note", text:
    "Baselines like the base rates promise buckets rather than price ranges — they live in the " +
    "views below." }));

  if (cov && cov.n) {
    const stats = el("div", { class: "stats" });
    const block = (v, label) => {
      const s = el("div", { class: "stat" });
      s.appendChild(el("div", { class: "v", text: v }));
      s.appendChild(el("div", { class: "l", text: label }));
      return s;
    };
    stats.appendChild(block(`${cov.inside} / ${cov.n}`, "days inside the zone (8 in 10 promised)"));
    stats.appendChild(block(`${cov.escapes.length}`, "breakouts — days the market escaped the zone"));
    wrap.appendChild(stats);
  }
  return wrap;
}

function modeOf(probs) {
  let best = 0;
  for (let i = 1; i < probs.length; i++) if (probs[i] > probs[best]) best = i;
  return best;
}
function directionOf(probs) {
  const down = probs[0] + probs[1], up = probs[3] + probs[4];
  return up > down ? 1 : down > up ? -1 : 0;
}

function dayByDay() {
  const wrap = el("section", null);
  wrap.appendChild(el("h2", { text: "Day by day — what each method said, and what happened" }));
  wrap.appendChild(el("p", { class: "note", text:
    "Every day each method spreads 100% of its belief across five outcomes, sized by that " +
    "day's volatility. The dark line is what gold actually did; the dots are the selected " +
    "method's best guess. Hover any day to see its full bet." }));

  const bl = el("div", { class: "blegend" });
  D.buckets.forEach((b, i) => bl.appendChild(el("span", null,
    el("i", { style: "background:" + BUCKET_COLOR[i] }), document.createTextNode(b))));
  wrap.appendChild(bl);

  const filters = el("div", { class: "filters", style: "margin-top:.6rem" });
  filters.appendChild(el("button", {
    class: state.movingOnly ? "on" : "",
    text: "moving days only",
    onclick: () => { state.movingOnly = !state.movingOnly; render(); },
  }));
  wrap.appendChild(filters);

  const h = state.horizon;
  if (!D.daily[0].probs) {
    wrap.appendChild(el("div", { class: "note", style: "margin-top:1rem", text:
      "This view needs the per-day distributions — regenerate ui/data/results.js with " +
      "evaluate_gold_poc.py --json (a re-score may still be running), then reload." }));
    return wrap;
  }

  const all = spanSlice(D.daily.map((d, i) => ({ d, i })));
  const days = all.filter(x => !state.movingOnly || x.d.outcome[h] !== 2);
  if (!days.length) { wrap.appendChild(el("div", { class: "note", text: "No days match." })); return wrap; }

  const W = 940, H = 252, ml = 88, mr = 12, mt = 10, mb = 26;
  const bandH = (H - mt - mb) / 5;
  const yC = bucket => mt + (4 - bucket + 0.5) * bandH;
  const x = i => days.length < 2 ? (ml + W - mr) / 2 : ml + (i / (days.length - 1)) * (W - ml - mr);
  const svg = el("svg:svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: "display:block; min-width:760px" });

  for (let b = 0; b < 5; b++) {
    svg.appendChild(el("svg:rect", {
      x: ml, y: yC(b) - bandH / 2, width: W - ml - mr, height: bandH,
      fill: BUCKET_COLOR[b], opacity: b === 2 ? 0.18 : 0.10,
    }));
    svg.appendChild(el("svg:text", {
      x: ml - 8, y: yC(b) + 3.5, "text-anchor": "end", "font-size": 11, fill: "#6f6a5e",
      text: D.buckets[b],
    }));
  }

  let lastMonth = "";
  days.forEach((day, i) => {
    const month = day.d.date.slice(0, 7);
    if (month !== lastMonth && i > 0) {
      svg.appendChild(el("svg:line", { x1: x(i), y1: mt, x2: x(i), y2: H - mb, stroke: "#efe9dc", "stroke-width": 1 }));
      svg.appendChild(el("svg:text", { x: x(i), y: H - 9, "text-anchor": "middle", "font-size": 10.5, fill: "#8d887b", text: month }));
    }
    lastMonth = month;
  });

  if (!state.movingOnly) {
    const path = days.map((day, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + yC(day.d.outcome[h]).toFixed(1)).join(" ");
    svg.appendChild(el("svg:path", { d: path, fill: "none", stroke: "#37342d", "stroke-width": 1.2, opacity: 0.75 }));
  }
  days.forEach((day, i) => {
    svg.appendChild(el("svg:rect", {
      x: x(i) - 2.2, y: yC(day.d.outcome[h]) - 2.2, width: 4.4, height: 4.4, fill: "#37342d",
    }));
  });

  days.forEach((day, i) => {
    const probs = day.d.probs[h][state.rung];
    if (!probs) return;
    const m = modeOf(probs), a = day.d.outcome[h], off = Math.abs(m - a);
    const attrs = { cx: x(i), cy: yC(m), r: 3.6, "stroke-width": 1.4 };
    if (off === 0) { attrs.fill = "var(--good)"; attrs.stroke = "#fffefb"; }
    else if (off === 1) { attrs.fill = "#d9a441"; attrs.stroke = "#fffefb"; }
    else { attrs.fill = "none"; attrs.stroke = "var(--bad)"; }
    svg.appendChild(el("svg:circle", attrs));
  });

  const tip = document.getElementById("tooltip");
  svg.addEventListener("mousemove", ev => {
    const rect = svg.getBoundingClientRect();
    const px = ((ev.clientX - rect.left) / rect.width) * W;
    const i = Math.max(0, Math.min(days.length - 1, Math.round(((px - ml) / (W - ml - mr)) * (days.length - 1))));
    const day = days[i].d, probs = day.probs[h][state.rung] || [];
    const strip = probs.map((p, b) =>
      `<span style="display:inline-block;height:.55rem;width:${Math.max(1, p * 90)}px;background:${BUCKET_COLOR[b]}"></span>`).join("");
    tip.innerHTML = `<div class="d">${day.date} · actually: ${D.buckets[day.outcome[h]]}</div>` +
      `${rname(state.rung)} best guess: ${D.buckets[modeOf(probs)]}<br>${strip}<br>` +
      `belief given to what happened: ${(100 * (probs[day.outcome[h]] || 0)).toFixed(0)}%`;
    tip.style.display = "block";
    tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - 250) + "px";
    tip.style.top = (ev.clientY + 14) + "px";
  });
  svg.addEventListener("mouseleave", () => { tip.style.display = "none"; });

  wrap.appendChild(el("div", { class: "scroll", style: "margin-top:.8rem" }, svg));
  wrap.appendChild(el("div", { class: "note", text:
    "● green = called the exact outcome · ● amber = one bucket off · ○ red = further off. " +
    "The line and squares are what actually happened." }));

  const score = rung => {
    let exact = 0, near = 0, dirRight = 0, moving = 0;
    for (const { d } of all) {
      const probs = d.probs[h][rung];
      if (!probs) return null;
      const a = d.outcome[h], m = modeOf(probs);
      if (m === a) exact++;
      if (Math.abs(m - a) <= 1) near++;
      if (a !== 2) {
        moving++;
        const actualDir = a < 2 ? -1 : 1;
        if (directionOf(probs) === actualDir) dirRight++;
      }
    }
    return { exact, near, dirRight, moving, n: all.length };
  };
  const mine = score(state.rung), bar = score("climatology");
  if (mine && bar) {
    const stats = el("div", { class: "stats" });
    const block = (v, of_, label, ref) => {
      const s = el("div", { class: "stat" });
      const val = el("div", { class: "v", text: `${v}` });
      val.appendChild(el("small", { text: ` / ${of_}` }));
      s.appendChild(val);
      s.appendChild(el("div", { class: "l", text: label }));
      s.appendChild(el("div", { class: "ref", text: `base rates: ${ref}` }));
      return s;
    };
    stats.appendChild(block(mine.exact, mine.n, "days the exact outcome was called", `${bar.exact} / ${bar.n}`));
    stats.appendChild(block(mine.near, mine.n, "days within one bucket", `${bar.near} / ${bar.n}`));
    stats.appendChild(block(mine.dirRight, mine.moving, "moving days with the direction right", `${bar.dirRight} / ${bar.moving}`));
    wrap.appendChild(stats);
  }
  wrap.appendChild(el("div", { class: "aim", text:
    "The room being chased: the base rates never call a move — history's frequencies say " +
    "“probably flat” every single day. The moving days are the ones an event-reading agent " +
    "is being built to win (increments 5–14), and this page is the bar it will have to clear." }));
  return wrap;
}

function latest() {
  if (!L || !L.horizons || !L.horizons[state.horizon]) return null;
  const hz = L.horizons[state.horizon];
  const wrap = el("section", null);
  wrap.appendChild(el("h2", { text: `Latest forecast · t+${state.horizon} — sealed ${L.as_of}, unscored` }));

  const table = el("table", null);
  const body = el("tbody", null);
  for (const rung of D.rungs) {
    const probs = hz.rungs[rung];
    if (!probs) continue;
    const strip = el("div", { class: "strip" });
    probs.forEach((p, i) => {
      const seg = el("div", {
        style: `width:${(p * 100).toFixed(2)}%; background:${BUCKET_COLOR[i]}`,
        class: BUCKET_LITE[i] ? "lite" : "",
        title: `${D.buckets[i]}: ${(p * 100).toFixed(1)}%`,
      });
      if (p >= 0.11) seg.textContent = Math.round(p * 100) + "%";
      strip.appendChild(seg);
    });
    const tr = el("tr", {
      class: rung === state.rung ? "focused pickable" : "pickable",
      onclick: () => setFocus(rung),
    });
    tr.appendChild(el("td", { class: "rname", title: rung }, el("span", { class: "dot", style: "background:" + (RUNG_STYLE[rung] || {}).color }), document.createTextNode(rname(rung))));
    const cell = el("td", null, strip);
    tr.appendChild(cell);
    body.appendChild(tr);
  }
  table.appendChild(body);
  wrap.appendChild(el("div", { class: "scroll" }, table));
  const e = hz.edges_pct;
  wrap.appendChild(el("div", { class: "note", text:
    `Bucket edges at ±0.5σ / ±1.5σ from today's σ = ${hz.sigma_pct}%:  ` +
    `large down < ${e[0]}%  ·  small down < ${e[1]}%  ·  flat < ${e[2]}%  ·  small up < ${e[3]}%  ·  large up above.  ` +
    `Scores when the corresponding CBR fixes land — nothing here is graded yet.` }));
  return wrap;
}

function liveTrack() {
  const track = ((window.POC_LIVE || {}).instruments || {})[state.instrument];
  const wrap = el("section", null);
  wrap.appendChild(el("h2", { text: "The live track record — sealed daily, scored when reality arrives" }));

  if (!track || !track.records.length) {
    wrap.appendChild(el("p", { class: "note", text:
      "Nothing sealed for this instrument yet. The daily runner creates the record:" }));
    wrap.appendChild(el("div", { class: "empty", style: "margin-top:.6rem; padding:1rem" },
      el("code", { text: "uv run python scripts/run_poc_daily.py" })));
    return wrap;
  }

  const records = track.records;
  const newest = records[records.length - 1];
  const scored = { "1": 0, "5": 0 };
  const sums = {};
  for (const r of records) {
    for (const h of Object.keys(scored)) {
      const m = r.matured[h];
      if (!m) continue;
      scored[h]++;
      for (const [rung, rps] of Object.entries(m.rps)) {
        (sums[rung] = sums[rung] || { "1": [], "5": [] })[h].push(rps);
      }
    }
  }
  const anyScored = scored["1"] + scored["5"] > 0;

  const stats = el("div", { class: "stats", style: "margin-top:.2rem" });
  const block = (v, label) => {
    const s = el("div", { class: "stat" });
    s.appendChild(el("div", { class: "v", text: v }));
    s.appendChild(el("div", { class: "l", text: label }));
    return s;
  };
  stats.appendChild(block(String(records.length), "day(s) sealed so far"));
  stats.appendChild(block(`${scored["1"]} + ${scored["5"]}`, "outcomes scored (t+1 + t+5)"));
  stats.appendChild(block(newest.as_of, newest.matured["1"]
    ? "latest seal — t+1 already scored"
    : "latest seal — waiting for its outcome"));
  wrap.appendChild(stats);

  if (anyScored) {
    const table = el("table", { style: "margin-top:1rem" });
    const head = el("tr", null);
    for (const t of ["method", `live RPS t+1 (${scored["1"]} day${scored["1"] === 1 ? "" : "s"})`,
                     `live RPS t+5 (${scored["5"]} day${scored["5"] === 1 ? "" : "s"})`])
      head.appendChild(el("th", { text: t, class: t === "method" ? "" : "num" }));
    table.appendChild(el("thead", null, head));
    const body = el("tbody", null);
    const mean = a => a.length ? (a.reduce((x, y) => x + y, 0) / a.length).toFixed(4) : "—";
    const order = D.rungs.filter(r => sums[r]).concat(Object.keys(sums).filter(r => !D.rungs.includes(r)));
    for (const rung of order) {
      const tr = el("tr", {
        class: rung === state.rung ? "focused pickable" : "pickable",
        onclick: () => setFocus(rung),
      });
      tr.appendChild(el("td", { class: "rname", title: rung },
        el("span", { class: "dot", style: "background:" + (RUNG_STYLE[rung] || {}).color }),
        document.createTextNode(rname(rung))));
      tr.appendChild(el("td", { class: "num", text: mean(sums[rung]["1"]) }));
      tr.appendChild(el("td", { class: "num", text: mean(sums[rung]["5"]) }));
      body.appendChild(tr);
    }
    table.appendChild(body);
    wrap.appendChild(el("div", { class: "scroll" }, table));
  }

  wrap.appendChild(el("div", { class: "note", text:
    "Every record was sealed before its outcome existed and is scored against the σ-edges " +
    "sealed with it — re-running a day can never rewrite history (the tests pin this). " +
    (state.instrument === "gold"
      ? "Gold's seals include the chronos_rwcov / timesfm_rwcov random-walk controls ADR-0056 " +
        "requires, seed recorded per day. "
      : "") +
    "The table is tiny today by construction: it grows one row per trading day once the " +
    "runner is scheduled (P6)." }));
  return wrap;
}

function ladder() {
  const wrap = el("section", null);
  wrap.appendChild(el("h2", { text:
    `The scoreboard · t+${state.horizon} — ${D.window.days} unseen days, RPS (lower is better)` }));

  const rows = D.ladder[state.horizon];
  const spans = rows.filter(r => !r.baseline);
  const lo = Math.min(0, ...spans.map(r => r.lo)), hi = Math.max(0, ...spans.map(r => r.hi));
  const scale = x => ((x - lo) / (hi - lo)) * 196 + 12;

  const table = el("table", null);
  const head = el("thead", null);
  const hr = el("tr", null);
  for (const [t, cls] of [["rung", ""], ["mean RPS", "num"], ["vs the bar (paired)", "num"], ["95% interval", ""], ["verdict", ""], ["days won", "num"]])
    hr.appendChild(el("th", { text: t, class: cls }));
  head.appendChild(hr); table.appendChild(head);
  const body = el("tbody", null);

  for (const r of rows) {
    const tr = el("tr", {
      class: r.rung === state.rung ? "focused pickable" : "pickable",
      onclick: () => setFocus(r.rung),
    });
    tr.appendChild(el("td", { class: "rname", title: r.rung },
      el("span", { class: "dot", style: "background:" + (RUNG_STYLE[r.rung] || {}).color }),
      document.createTextNode(rname(r.rung))));
    tr.appendChild(el("td", { class: "num", text: r.mean.toFixed(4) }));
    if (r.baseline) {
      tr.appendChild(el("td", { class: "num bench", text: "— the bar" }));
      tr.appendChild(el("td", { class: "bench", text: "" }));
      tr.appendChild(el("td", { class: "bench", text: "" }));
      tr.appendChild(el("td", { class: "bench num", text: "" }));
    } else {
      tr.appendChild(el("td", { class: "num", text: fmt(r.diff) }));
      const svg = el("svg:svg", { width: 220, height: 16, viewBox: "0 0 220 16" });
      svg.appendChild(el("svg:line", { x1: scale(0), y1: 2, x2: scale(0), y2: 14, stroke: "#c9c3b4", "stroke-width": 1 }));
      svg.appendChild(el("svg:line", { x1: scale(r.lo), y1: 8, x2: scale(r.hi), y2: 8, stroke: "#8d887b", "stroke-width": 1.6 }));
      svg.appendChild(el("svg:circle", { cx: scale(r.diff), cy: 8, r: 3.4, fill: (RUNG_STYLE[r.rung] || {}).color || "#333" }));
      tr.appendChild(el("td", { title: `[${fmt(r.lo)}, ${fmt(r.hi)}]` }, svg));
      const cls = r.verdict === "worse" ? "v-worse" : r.verdict === "BETTER" ? "v-better" : "v-nd";
      const label = r.verdict === "no detectable difference" ? "no detectable diff." : r.verdict;
      tr.appendChild(el("td", null, el("span", { class: "verdict " + cls, text: label })));
      tr.appendChild(el("td", { class: "num", text: `${r.wins}/${r.n}` }));
    }
    body.appendChild(tr);
  }
  table.appendChild(body);
  wrap.appendChild(el("div", { class: "scroll" }, table));
  wrap.appendChild(el("div", { class: "note", text:
    "Paired per day: every rung is scored on identical days, so shared outcome noise cancels. " +
    "Whiskers are Newey–West at lag = horizon−1 (t+5 outcomes overlap four sessions). " +
    "The tick marks zero — a whisker crossing it is not a result." }));
  return wrap;
}

function chart() {
  const wrap = el("section", null);
  wrap.appendChild(el("h2", { text:
    `The race · t+${state.horizon} — cumulative gap to climatology, below zero is ahead` }));

  const days = spanSlice(D.daily), h = state.horizon;
  const rungs = D.rungs.filter(r => r !== "climatology" && r !== "all_flat");
  const series = {};
  for (const r of rungs) {
    let sum = 0;
    series[r] = days.map(d => (sum += d.rps[h][r] - d.rps[h]["climatology"], sum));
  }
  const values = rungs.flatMap(r => series[r]).concat([0]);
  let min = Math.min(...values), max = Math.max(...values);
  const pad = (max - min || 1) * 0.08; min -= pad; max += pad;

  const W = 940, H = 330, ml = 52, mr = 14, mt = 24, mb = 30;
  const x = i => ml + (i / (days.length - 1)) * (W - ml - mr);
  const y = v => mt + (1 - (v - min) / (max - min)) * (H - mt - mb);
  const svg = el("svg:svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: "display:block" });
  svg.appendChild(el("svg:text", { x: ml, y: 13, "font-size": 10, fill: "#b0aa9b",
    text: "running total of each method's daily gap to the base rates (RPS)" }));

  const step = (max - min) / 4;
  for (let k = 0; k <= 4; k++) {
    const v = min + step * k;
    svg.appendChild(el("svg:line", { x1: ml, y1: y(v), x2: W - mr, y2: y(v), stroke: "#efebe0", "stroke-width": 1 }));
    svg.appendChild(el("svg:text", { x: ml - 7, y: y(v) + 3.5, "text-anchor": "end", "font-size": 10.5, fill: "#8d887b", text: v.toFixed(1) }));
  }
  svg.appendChild(el("svg:line", { x1: ml, y1: y(0), x2: W - mr, y2: y(0), stroke: "#57534a", "stroke-width": 1.3 }));
  if (y(0) - 14 > mt)
    svg.appendChild(el("svg:text", { x: W - mr - 4, y: y(0) - 6, "text-anchor": "end", "font-size": 10.5, fill: "#8d887b", text: "above the line = losing to the base rates" }));
  if (y(0) + 22 < H - mb)
    svg.appendChild(el("svg:text", { x: W - mr - 4, y: y(0) + 14, "text-anchor": "end", "font-size": 10.5, fill: "#8d887b", text: "below = beating them" }));

  let lastMonth = "";
  days.forEach((d, i) => {
    const month = d.date.slice(0, 7);
    if (month !== lastMonth && i > 0) {
      svg.appendChild(el("svg:line", { x1: x(i), y1: mt, x2: x(i), y2: H - mb, stroke: "#f2efe6", "stroke-width": 1 }));
      svg.appendChild(el("svg:text", { x: x(i), y: H - 10, "text-anchor": "middle", "font-size": 10.5, fill: "#8d887b", text: month }));
    }
    lastMonth = month;
  });

  // Draw unfocused lines first and dimmed, the focused method last and bold.
  for (const r of [...rungs.filter(r => r !== state.rung), ...rungs.filter(r => r === state.rung)]) {
    const focused = r === state.rung;
    const path = series[r].map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
    svg.appendChild(el("svg:path", {
      d: path, fill: "none", stroke: (RUNG_STYLE[r] || {}).color || "#888",
      "stroke-width": focused ? 2.4 : 1.2, opacity: focused ? 1 : 0.4,
      "stroke-dasharray": (RUNG_STYLE[r] || {}).dash || "",
    }));
  }

  const guide = el("svg:line", { x1: -9, y1: mt, x2: -9, y2: H - mb, stroke: "#b6b0a2", "stroke-width": 1, "stroke-dasharray": "3 3" });
  svg.appendChild(guide);
  const tip = document.getElementById("tooltip");
  svg.addEventListener("mousemove", ev => {
    const rect = svg.getBoundingClientRect();
    const px = ((ev.clientX - rect.left) / rect.width) * W;
    const i = Math.max(0, Math.min(days.length - 1, Math.round(((px - ml) / (W - ml - mr)) * (days.length - 1))));
    guide.setAttribute("x1", x(i)); guide.setAttribute("x2", x(i));
    const lines = rungs.map(r => {
      const name = r === state.rung ? `<b>${rname(r)}</b>` : rname(r);
      return `<span style="color:${(RUNG_STYLE[r] || {}).color}">●</span> ${name}  ${fmt(series[r][i], 3)}`;
    });
    tip.innerHTML = `<div class="d">${days[i].date} · outcome: ${D.buckets[days[i].outcome[h]]}</div>` + lines.join("<br>");
    tip.style.display = "block";
    tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - 250) + "px";
    tip.style.top = (ev.clientY + 14) + "px";
  });
  svg.addEventListener("mouseleave", () => { tip.style.display = "none"; guide.setAttribute("x1", -9); guide.setAttribute("x2", -9); });

  const legend = el("div", { class: "legend" });
  for (const r of rungs) {
    const b = el("button", { class: r === state.rung ? "on" : "", title: r, onclick: () => setFocus(r) },
      lineSwatch(r), document.createTextNode(rname(r)));
    legend.appendChild(b);
  }
  const bar = el("div", { class: "bar" }); bar.appendChild(legend);
  wrap.appendChild(bar);
  wrap.appendChild(svg);
  wrap.appendChild(el("div", { class: "note", text:
    "Each line adds up one method's daily gap to the base rates at t+" + h + " over the " +
    "shown window — solid or dashed exactly as in its legend chip, with the focused method " +
    "bold. A method with real skill drifts below zero and stays there. Click a chip to " +
    "focus a method everywhere; the always-flat dummy is excluded (it dwarfs the scale). " +
    "This becomes the learning curve as live days append." }));
  return wrap;
}

function byOutcome() {
  const wrap = el("section", null);
  wrap.appendChild(el("h2", { text:
    `By what actually happened · t+${state.horizon} — mean RPS per realised bucket` }));
  const per = D.by_outcome[state.horizon];
  const base = per["climatology"];
  const counts = {};
  for (const d of D.daily) counts[d.outcome[state.horizon]] = (counts[d.outcome[state.horizon]] || 0) + 1;

  const table = el("table", null);
  const head = el("tr", null);
  head.appendChild(el("th", { text: "rung" }));
  D.buckets.forEach((b, i) => head.appendChild(el("th", { class: "num", text: `${b} (${counts[i] || 0})` })));
  table.appendChild(el("thead", null, head));
  const body = el("tbody", null);
  for (const rung of D.rungs) {
    const tr = el("tr", {
      class: rung === state.rung ? "focused pickable" : "pickable",
      onclick: () => setFocus(rung),
    });
    tr.appendChild(el("td", { class: "rname", title: rung },
      el("span", { class: "dot", style: "background:" + (RUNG_STYLE[rung] || {}).color }),
      document.createTextNode(rname(rung))));
    for (let b = 0; b < D.buckets.length; b++) {
      const v = per[rung] ? per[rung][String(b)] : undefined;
      const td = el("td", { class: "num", text: v === undefined ? "—" : v.toFixed(3) });
      if (v !== undefined && rung !== "climatology" && base[String(b)] !== undefined) {
        const delta = v - base[String(b)];
        if (delta <= -0.01) td.style.background = "var(--good-soft)";
        else if (delta >= 0.01) td.style.background = "var(--bad-soft)";
        td.title = "vs climatology: " + fmt(delta, 3);
      }
      tr.appendChild(td);
    }
    body.appendChild(tr);
  }
  table.appendChild(body);
  wrap.appendChild(el("div", { class: "scroll" }, table));
  wrap.appendChild(el("div", { class: "note", text:
    "Green: at least 0.010 better than climatology on those days; red: at least 0.010 worse. " +
    "The flat plurality dominates the overall mean — capability on moving days is what to watch." }));
  return wrap;
}

function story() {
  const wrap = el("section", null);
  wrap.appendChild(el("h2", { text: "How these numbers earned their honesty" }));
  const items = [
    ["fixed", "<b>Climatology was miscalibrated</b> — history was bucketed against today's σ, so the bar moved with the volatility regime. Each return is now bucketed by its own contemporaneous σ (REQ-401)."],
    ["fixed", "<b>The comparison was unpaired</b> — pairing per day tightened intervals roughly fourfold and moved three verdicts (T13.9)."],
    ["fixed", "<b>The covariate join leaked one session</b> — a FRED value dated D is that day's US close, hours <i>after</i> CBR fixed the next day's price. The join now runs on knowledge days; removing the leak made covariate rungs worse."],
    ["fixed", "<b>Errors ignored horizon overlap</b> — t+5 outcomes share four sessions with their neighbours. Newey–West errors widened three borderline “worse” verdicts to “no detectable difference”."],
    ["found", "<b>Covariates hurt via spurious regression</b> — an unrelated random walk damages the forecast as much as a real macro series; white noise barely does. Granger–Newbold, inside in-context learning."],
    ["found", "<b>The damage exists only out of training</b> — the same probe on 2025 days finds nothing. The 2026 contamination boundary is demonstrated, not assumed."],
    ["binding", "<b>ADR-0056 accepted</b> — every covariate rung will carry a random-walk control scored on the same live days; no covariate is called informative unless it beats its control."],
  ];
  const list = el("ul", { class: "story" });
  for (const [tag, html] of items) {
    const li = el("li", null, el("span", { class: "tag", text: tag.toUpperCase() }));
    const p = el("p", null); p.innerHTML = html; li.appendChild(p);
    list.appendChild(li);
  }
  wrap.appendChild(list);
  return wrap;
}

function footer() {
  const f = document.getElementById("foot");
  f.textContent = "";
  const rung2 = D.rungs.includes("cond_climatology")
    ? "Rung 2 conditions at backoff level 2 with provisional N_min = " + D.n_min_provisional +
      " (REQ-408 calibrates it later). "
    : "";
  f.appendChild(el("div", { text:
    `Generated from data through ${D.generated} · every committed number is derived work ` +
    "(scores, probabilities, σ, edges) — REQ-1106/1107; the price layer stays on this " +
    "machine. " + rung2 +
    "Regenerate: evaluate_gold_poc.py --instrument <gold|usd_rub|usd_inr> --json … --prices … · " +
    "forecast_gold_today.py" }));
}

function render() {
  ({ D, P, L } = pack(state.instrument));
  if (!state.horizon || !D.horizons.includes(state.horizon))
    state.horizon = D.horizons.includes("5") ? "5" : D.horizons[0];
  if (!D.rungs.includes(state.rung))
    state.rung = D.rungs.includes("chronos_uni") ? "chronos_uni" : D.rungs[0];
  meta();
  controls();
  const c = document.getElementById("content");
  c.textContent = "";
  c.appendChild(hero());
  c.appendChild(priceChart());
  c.appendChild(dayByDay());
  const l = latest(); if (l) c.appendChild(l);
  c.appendChild(liveTrack());
  c.appendChild(ladder());
  c.appendChild(chart());
  c.appendChild(byOutcome());
  c.appendChild(story());
  footer();
}

if (!AVAILABLE.length) {
  emptyState();
} else {
  if (!AVAILABLE.includes(state.instrument)) state.instrument = AVAILABLE[0];
  render();
}
</script>
